<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 450" width="1040" height="450" role="img" aria-label="meeting-to-brief process chain: transcript in, silent analysis, three to four questions, record out, prompt out">
  <style>
    :root { color-scheme: light dark; }
    .bg    { fill: none; }
    .box   { fill: #ffffff; stroke: #d4d4d8; stroke-width: 1.5; }
    .out   { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; }
    .side  { fill: none; stroke: #d4d4d8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .t     { fill: #18181b; font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m     { fill: #71717a; font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ln    { stroke: #a1a1aa; stroke-width: 1.5; fill: none; }
    .head  { fill: #a1a1aa; }
    .num   { fill: #a1a1aa; font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .box  { fill: #18181b; stroke: #3f3f46; }
      .out  { fill: #172554; stroke: #1d4ed8; }
      .side { stroke: #3f3f46; }
      .t    { fill: #fafafa; }
      .m    { fill: #a1a1aa; }
      .ln   { stroke: #52525b; }
      .head { fill: #52525b; }
      .num  { fill: #52525b; }
    }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1040" height="450"/>

  <text class="t" x="20" y="34" font-size="19" font-weight="600">meeting-to-brief</text>
  <text class="m" x="20" y="56" font-size="13.5">From a raw transcript to a brief the next agent can act on.</text>

  <!-- side branch: long transcripts -->
  <rect class="side" x="203" y="100" width="224" height="98" rx="10"/>
  <text class="t" x="219" y="124" font-size="13" font-weight="600">If it does not fit in one pass</text>
  <text class="m" x="219" y="146" font-size="12.5">Split at natural seams.</text>
  <text class="m" x="219" y="165" font-size="12.5">One part note per part.</text>
  <text class="m" x="219" y="184" font-size="12.5">Handover prompt for a fresh chat.</text>
  <path class="ln" marker-end="url(#a)" d="M 315 198 L 315 248"/>

  <!-- step 1 -->
  <rect class="box" x="20" y="250" width="180" height="86" rx="10"/>
  <text class="num" x="36" y="274" font-size="11" font-weight="600">1</text>
  <text class="t"   x="36" y="294" font-size="14.5" font-weight="600">Transcript in</text>
  <text class="m"   x="36" y="313" font-size="12.5">Text or file. Jamie,</text>
  <text class="m"   x="36" y="329" font-size="12.5">Otter, .vtt, own notes.</text>
  <path class="ln" marker-end="url(#a)" d="M 200 293 L 223 293"/>

  <!-- step 2 -->
  <rect class="box" x="225" y="250" width="180" height="86" rx="10"/>
  <text class="num" x="241" y="274" font-size="11" font-weight="600">2</text>
  <text class="t"   x="241" y="294" font-size="14.5" font-weight="600">Silent analysis</text>
  <text class="m"   x="241" y="313" font-size="12.5">Decisions, vague spots,</text>
  <text class="m"   x="241" y="329" font-size="12.5">contradictions, gaps.</text>
  <path class="ln" marker-end="url(#a)" d="M 405 293 L 428 293"/>

  <!-- step 3 -->
  <rect class="box" x="430" y="250" width="180" height="86" rx="10"/>
  <text class="num" x="446" y="274" font-size="11" font-weight="600">3</text>
  <text class="t"   x="446" y="294" font-size="14.5" font-weight="600">3 to 4 questions</text>
  <text class="m"   x="446" y="313" font-size="12.5">Only gaps that change</text>
  <text class="m"   x="446" y="329" font-size="12.5">the result. You answer.</text>
  <path class="ln" marker-end="url(#a)" d="M 610 293 L 633 293"/>

  <!-- loop under step 3 -->
  <path class="ln" marker-end="url(#a)" d="M 470 336 C 470 384, 570 384, 570 338"/>
  <text class="m" x="520" y="404" font-size="12" text-anchor="middle">up to 3 rounds, then stop</text>

  <!-- step 4 -->
  <rect class="out" x="635" y="250" width="180" height="86" rx="10"/>
  <text class="num" x="651" y="274" font-size="11" font-weight="600">4</text>
  <text class="t"   x="651" y="294" font-size="14.5" font-weight="600">Record out</text>
  <text class="m"   x="651" y="313" font-size="12.5">Goal, decisions, owners,</text>
  <text class="m"   x="651" y="329" font-size="12.5">next steps, open points.</text>
  <path class="ln" marker-end="url(#a)" d="M 815 293 L 838 293"/>

  <!-- step 5 -->
  <rect class="out" x="840" y="250" width="180" height="86" rx="10"/>
  <text class="num" x="856" y="274" font-size="11" font-weight="600">5</text>
  <text class="t"   x="856" y="294" font-size="14.5" font-weight="600">Prompt out</text>
  <text class="m"   x="856" y="313" font-size="12.5">Copy-paste. Works</text>
  <text class="m"   x="856" y="329" font-size="12.5">without the transcript.</text>

  <text class="m" x="1020" y="404" font-size="12" text-anchor="end">Steps 4 and 5 are always Simple English, whatever language the meeting was in.</text>
</svg>
